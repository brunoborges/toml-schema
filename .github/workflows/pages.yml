name: GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - SPEC.md
      - REFERENCE_IMPLEMENTATIONS.md
      - scripts/render-docs.mjs
      - scripts/package.json
      - scripts/package-lock.json
      - .github/workflows/pages.yml
  pull_request:
    branches:
      - main
    paths:
      - docs/**
      - SPEC.md
      - REFERENCE_IMPLEMENTATIONS.md
      - scripts/render-docs.mjs
      - scripts/package.json
      - scripts/package-lock.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install site build dependencies
        working-directory: scripts
        run: npm ci

      - name: Render documentation pages
        working-directory: scripts
        run: npm run render-docs

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs

  deploy:
    name: Deploy static site
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: Record publication targets
        run: |
          {
            echo "### Documentation publication"
            echo
            echo "- Canonical: https://tomlschema.org/"
            echo "- Legacy mirror: https://toml-schema.org/"
            echo "- Legacy mirror publisher: https://github.com/brunoborges/tomlschema.org"
          } >> "$GITHUB_STEP_SUMMARY"
