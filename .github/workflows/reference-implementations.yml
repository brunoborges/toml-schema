name: Reference implementations

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java reference implementation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: reference-implementations/java/pom.xml

      - name: Test
        run: mvn -B -f reference-implementations/java/pom.xml test

  go:
    name: Go reference implementation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: reference-implementations/go/go.mod
          cache-dependency-path: reference-implementations/go/go.sum

      - name: Test
        working-directory: reference-implementations/go
        run: go test ./...

  dotnet:
    name: .NET reference implementation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Test
        run: dotnet test reference-implementations/dotnet/TomlSchema.sln -v normal

  python:
    name: Python reference implementation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install library
        run: python -m pip install reference-implementations/python

      - name: Test
        run: python -m unittest discover -s reference-implementations/python/tests -v

  rust:
    name: Rust reference implementation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            reference-implementations/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('reference-implementations/rust/Cargo.toml') }}

      - name: Test
        working-directory: reference-implementations/rust
        run: cargo test --locked

      - name: Build canonical CLI
        working-directory: reference-implementations/rust
        run: cargo build --locked --release

      - name: Validate checked-in example with explicit schema
        run: reference-implementations/rust/target/release/toml-schema validate config.tosd config.toml

      - name: Validate checked-in example with schema reference
        run: reference-implementations/rust/target/release/toml-schema validate config.toml

      - name: Validate example schema against self-schema
        run: reference-implementations/rust/target/release/toml-schema validate toml-schema.tosd config.tosd

      - name: Validate self-schema against itself
        run: reference-implementations/rust/target/release/toml-schema validate toml-schema.tosd toml-schema.tosd

      - name: Extract schema from checked-in example
        run: reference-implementations/rust/target/release/toml-schema extract config.toml /tmp/config.generated.tosd

      - name: Validate checked-in example with extracted schema
        run: reference-implementations/rust/target/release/toml-schema validate /tmp/config.generated.tosd config.toml

  typescript:
    name: TypeScript reference implementation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: reference-implementations/typescript/package-lock.json

      - name: Install dependencies
        run: npm --prefix reference-implementations/typescript ci

      - name: Typecheck
        run: npm --prefix reference-implementations/typescript run typecheck

      - name: Test
        run: npm --prefix reference-implementations/typescript test

      - name: Build
        run: npm --prefix reference-implementations/typescript run build
