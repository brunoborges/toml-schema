name: Reference implementations

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java reference implementation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: reference-implementations/java/pom.xml

      - name: Test
        run: mvn -B -f reference-implementations/java/pom.xml test

  go:
    name: Go reference implementation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: reference-implementations/go/go.mod
          cache-dependency-path: reference-implementations/go/go.sum

      - name: Test
        working-directory: reference-implementations/go
        run: go test ./...

  dotnet:
    name: .NET reference implementation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test reference-implementations/dotnet/TomlSchema.sln -v normal

  python:
    name: Python reference implementation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install library
        run: python -m pip install reference-implementations/python

      - name: Test
        run: python -m unittest discover -s reference-implementations/python/tests -v

  rust:
    name: Rust reference implementation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            reference-implementations/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('reference-implementations/rust/Cargo.toml') }}

      - name: Test
        working-directory: reference-implementations/rust
        run: cargo test --locked

      - name: Build canonical CLI
        working-directory: reference-implementations/rust
        run: cargo build --locked --release --bin tosd

      - name: Validate checked-in example with explicit schema
        run: reference-implementations/rust/target/release/tosd validate config.tosd config.toml

      - name: Validate checked-in example with schema reference
        run: reference-implementations/rust/target/release/tosd validate config.toml

      - name: Validate example schema against self-schema
        run: reference-implementations/rust/target/release/tosd validate toml-schema.tosd config.tosd

      - name: Validate self-schema against itself
        run: reference-implementations/rust/target/release/tosd validate toml-schema.tosd toml-schema.tosd

      - name: Extract schema from checked-in example
        run: reference-implementations/rust/target/release/tosd extract config.toml /tmp/config.generated.tosd

      - name: Validate checked-in example with extracted schema
        run: reference-implementations/rust/target/release/tosd validate /tmp/config.generated.tosd config.toml

  typescript:
    name: TypeScript reference implementation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: reference-implementations/typescript/package-lock.json

      - name: Install dependencies
        run: npm --prefix reference-implementations/typescript ci

      - name: Typecheck
        run: npm --prefix reference-implementations/typescript run typecheck

      - name: Test
        run: npm --prefix reference-implementations/typescript test

      - name: Build
        run: npm --prefix reference-implementations/typescript run build
