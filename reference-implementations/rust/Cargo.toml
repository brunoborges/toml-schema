[package]
name = "toml-schema"
version = "1.0.0-rc.2"
edition = "2024"
rust-version = "1.97.1"
description = "Reference implementation of TOML Schema for Rust"
homepage = "https://tomlschema.org"
repository = "https://github.com/brunoborges/toml-schema"
license = "MIT"
publish = false

[lib]
name = "toml_schema"
path = "src/lib.rs"

[[bin]]
name = "tosd"
path = "src/main.rs"

[dependencies]
toml = "1"
regex = "1"
url = "2"
